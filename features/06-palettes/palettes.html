<section class="sidebar-section">
    <h2 data-i18n="sec_palettes">4. 팔레트 관리</h2>
    
    <div class="palette-mode-selector-wrapper">
        <select id="paletteModeSelect" class="palette-mode-dropdown">
            <option value="geopixels">GeoPixels</option>
            <option value="wplace">Wplace</option>
            <option value="uplace">Youplace</option>
            <option value="bplace">Bplace</option>
        </select>
    </div>

    <div id="palette-container"></div>

    <div id="wplace-inclusion-section" class="palette-inclusion-group">
        <label class="palette-checkbox-card">
            <input type="checkbox" id="useWplaceInGeopixels">
            <span data-i18n="label_use_wplace" class="palette-checkbox-text">Wplace 팔레트 함께 사용하기</span>
        </label>
        
        <label class="palette-checkbox-card">
            <input type="checkbox" id="useUplaceInGeopixels">
            <span data-i18n="label_use_uplace" class="palette-checkbox-text">Youplace 팔레트 함께 사용하기</span>
        </label>

        <label class="palette-checkbox-card">
            <input type="checkbox" id="useBplaceInGeopixels">
            <span data-i18n="label_use_bplace" class="palette-checkbox-text">Bplace 팔레트 함께 사용하기</span>
        </label>
    </div>

    <div class="kmeans-track track-divider"></div>

    <div class="custom-palette-header">
            <label class="custom-palette-label">
                <span data-i18n="label_custom_palette">🎨 커스텀 팔레트</span>
                <span id="customColorCount" class="custom-palette-count">[0]</span>
            </label>
            <div class="view-mode-toggle">
                <button id="viewListBtn" class="mini-btn view-btn active" title="리스트 뷰">☰</button>
                <button id="viewGridBtn" class="mini-btn view-btn" title="그리드 뷰">▦</button>
            </div>
        </div>

        <div class="custom-input-wrapper">
            <input type="text" id="addHex" placeholder="HEX (#FFFFFF)" class="ui-input hex-input" maxlength="25">
            <div class="rgb-input-group">
                <input type="number" id="addR" placeholder="R" min="0" max="255" class="ui-input rgb-input">
                <input type="number" id="addG" placeholder="G" min="0" max="255" class="ui-input rgb-input">
                <input type="number" id="addB" placeholder="B" min="0" max="255" class="ui-input rgb-input">
                <button id="addColorBtn" class="action-btn btn-add-color">+</button>
            </div>
        </div>

        <div class="palette-action-group">
            <button id="toggleAllCustomBtn" class="mini-btn btn-toggle-all" data-i18n-title="title_toggle_all" title="커스텀 전체 선택/해제">A</button>
            
            <select id="paletteSortSelect" class="palette-sort-select">
                <option value="added" data-i18n="opt_sort_added">추가순</option>
                <option value="count" data-i18n="opt_sort_count">사용량순</option>
                <option value="bright" data-i18n="opt_sort_bright">밝기순</option>
                <option value="r" data-i18n="opt_sort_r">R값 높은순</option>
                <option value="g" data-i18n="opt_sort_g">G값 높은순</option>
                <option value="b" data-i18n="opt_sort_b">B값 높은순</option>
            </select>

            <div class="palette-action-right">
                <button id="resetAddedColorsBtn" class="mini-btn" data-i18n-title="title_reset_custom" title="전체 초기화">🔄</button>
                <button id="exportPaletteBtn" class="mini-btn" data-i18n-title="title_export_palette" title="팔레트 내보내기">💾</button>
                <button id="importPaletteBtn" class="mini-btn" data-i18n-title="title_import_palette" title="팔레트 불러오기">📂</button>
            </div>
            <input type="file" id="paletteUpload" accept=".json" style="display: none;">
        </div>

        <div id="custom-palette-container"></div>
    </div>
</section>
